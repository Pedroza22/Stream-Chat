#!/usr/sbin/nft -f
# =============================================================================
# Stream-Chat — Firewall de host con nftables (hardening, sección 10)
# -----------------------------------------------------------------------------
# Ubicación en el servidor:  /etc/nftables.conf
#
#   Validar SIEMPRE antes de aplicar (no cambia nada, solo comprueba):
#       sudo nft -c -f /etc/nftables.conf
#   Aplicar:
#       sudo nft -f /etc/nftables.conf
#       sudo systemctl enable --now nftables   # persistir en el arranque
#
# Este archivo parte del `nftables.txt` del campus y aplica las 8 correcciones
# de la sección 10.4 del plan de trabajo. El detalle observación → corrección
# está en infra/nftables/README.md.
#
# Resumen de correcciones:
#   #1 IP de administración válida (203.0.113.10/32) en lugar de ¡TU_IP!
#   #2 Se abren 80 y 443 (no solo 80): hace falta HTTPS y wss://
#   #3 No usar `flush ruleset`: se recrea SOLO la tabla propia
#   #4 La regla de admin_ips se evalúa ANTES que la anti-escaneo
#   #5 ICMP con límite de tasa + tipos necesarios de ICMPv6
#   #6 Log de los descartes al final de la cadena de entrada
#   #7 Política de salida documentada (la guía usa drop + lista blanca)
#   #8 Set `blocklist` con `flags timeout` para baneos temporales
# =============================================================================

# -----------------------------------------------------------------------------
# Recrear SOLO nuestra tabla, sin tocar las reglas de Docker.
# -----------------------------------------------------------------------------
# NO usar `flush ruleset`: borraría también las tablas/cadenas que Docker
# instala (`ip nat`, `ip filter` con las cadenas DOCKER y DOCKER-USER) y dejaría
# a los contenedores sin red.
#
# El patrón "declarar la tabla y borrarla" es idempotente: `table` la crea si no
# existe (no falla si ya existe) y `delete` la elimina; después el bloque la
# vuelve a crear limpia. Solo afecta a la tabla `inet firewall`, que es la
# nuestra.
#
# En versiones recientes de nftables puede usarse, como alternativa más directa,
# `destroy table inet firewall` (borra si existe, sin error si no existe).
table inet firewall
delete table inet firewall

table inet firewall {

    # -------------------------------------------------------------------------
    # Set de IPs de administración (SSH).
    #   REEMPLAZAR 203.0.113.10/32 por la IP pública real desde la que se
    #   administra la instancia. Si son varias IPs o un rango, mantener
    #   `flags interval` y separar por comas, p. ej.:
    #       elements = { 203.0.113.10/32, 198.51.100.0/24 }
    # -------------------------------------------------------------------------
    set admin_ips {
        type ipv4_addr
        flags interval
        elements = { 203.0.113.10/32 }
    }

    # -------------------------------------------------------------------------
    # Set de bloqueo temporal (ban). `flags timeout` permite que cada entrada
    # caduque sola, sin reescribir reglas. El administrador puede añadir una IP
    # manualmente:
    #       nft add element inet firewall blocklist { 198.51.100.7 timeout 1h }
    # Fail2ban también puede escribir aquí (jail `recidive`).
    # -------------------------------------------------------------------------
    set blocklist {
        type ipv4_addr
        flags timeout
    }

    # =========================================================================
    # Cadena INPUT — tráfico destinado al propio host.
    # Política `drop`: denegar por defecto (principio de la guía).
    # =========================================================================
    chain input {
        type filter hook input priority filter; policy drop;

        # 0) IPs baneadas primero: se descartan antes de cualquier `accept`.
        ip saddr @blocklist drop

        # 1) Loopback siempre permitido (servicios locales y healthchecks).
        iif "lo" accept

        # 2) Conexiones establecidas o relacionadas: se aceptan sin re-evaluar.
        #    Los paquetes `invalid` se descartan.
        ct state established,related accept
        ct state invalid drop

        # 3) ICMP con límite de tasa (evita amplificación/abuso de echo).
        ip protocol icmp icmp type { echo-request } limit rate 5/second accept

        # 3b) ICMPv6: en una tabla `inet` con IPv6, una política drop sin esto
        #     rompería el descubrimiento de vecinos (NDP) y SLAAC. Se aceptan
        #     solo los tipos necesarios.
        meta l4proto ipv6-icmp icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded,
            parameter-problem, nd-router-advert, nd-neighbor-solicit,
            nd-neighbor-advert, nd-redirect, echo-request
        } accept

        # 4) CORRECCIÓN #4 — admin_ips ANTES de la regla anti-escaneo.
        #    SSH (22) solo desde IPs de administración, con límite de tasa.
        #    Como se evalúa primero, la propia administración no queda atrapada
        #    por el límite de la regla anti-escaneo.
        ip saddr @admin_ips tcp dport 22 ct state new \
            limit rate 4/minute accept

        # 5) Anti-escaneo para el resto: solo REGISTRA. La política `drop` ya
        #    bloquea a quien no esté en admin_ips, así que aquí no se acepta.
        #    (Para un baneo real, añadir un set `ssh_scanners` y descartarlo,
        #    o delegar en Fail2ban con el jail sshd.)
        tcp dport 22 ct state new limit rate 4/minute \
            log prefix "nft-ssh-scan: "

        # 6) CORRECCIÓN #2 — servicios públicos: 80 (redirección a HTTPS y reto
        #    ACME de certbot) y 443 (HTTPS + WebSocket wss://).
        tcp dport { 80, 443 } ct state new accept

        # 7) CORRECCIÓN #6 — registro de lo descartado, con límite de tasa para
        #    no inundar el log, y contador para métricas.
        log prefix "nft-drop-in: " limit rate 10/minute
        counter drop
    }

    # =========================================================================
    # Cadena FORWARD — tráfico entre interfaces (incluye el de los contenedores
    # de Docker).
    # -------------------------------------------------------------------------
    # IMPORTANTE (sección 10.3, punto 3): Docker enruta el tráfico de los
    # contenedores por el FORWARD del host e inserta sus propias cadenas
    # (DOCKER, DOCKER-USER). Por eso se deja `policy accept`: una política
    # `drop` aquí dejaría a los contenedores sin red. Para endurecer el
    # reenvío, usar la cadena DOCKER-USER (que Docker respeta) en lugar de la
    # política por defecto.
    # =========================================================================
    chain forward {
        type filter hook forward priority filter; policy accept;

        # Solo se descartan IPs de la blocklist.
        ip saddr @blocklist drop
    }

    # =========================================================================
    # Cadena OUTPUT — tráfico originado por el propio host.
    # -------------------------------------------------------------------------
    # CORRECCIÓN #7: se deja `policy accept`. Una política `drop` en la salida
    # afecta SOLO al tráfico del host, NO al de los contenedores (que se evalúa
    # en forward), y puede romper apt/unattended-upgrades y otros servicios.
    #
    # Si el objetivo es limitar la exfiltración, usar el modelo de la guía:
    # `policy drop` y permitir solo DNS (53), NTP (123), 80 y 443; o un proxy
    # Squid con lista blanca de dominios (ampliación). Bloquear unos pocos DNS
    # públicos concretos, como en el archivo original, NO es un control de
    # exfiltración (se evade con otro DNS o DNS-over-HTTPS).
    # =========================================================================
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# =============================================================================
# CONSIDERACIONES SOBRE DOCKER (sección 10.3, puntos 2 y 3)
# -----------------------------------------------------------------------------
# 1) NO aplicar `net.ipv4.ip_forward = 0`. Docker necesita el reenvío de
#    paquetes para la NAT interna y la publicación de puertos. Si la guía
#    genérica lo activa, OMITIRLO cuando se usa Docker.
#
# 2) La cadena `forward` se deja en `policy accept` a propósito (ver arriba).
#
# 3) Tras aplicar el firewall, reiniciar Docker para que regenere sus reglas:
#       sudo systemctl restart docker
#    y comprobar la conectividad entre contenedores:
#       docker compose exec app sh -c 'getent hosts postgres rabbitmq kafka'
#       docker compose exec app curl -fsS http://localhost:8080/actuator/health
#
# 4) Los puertos de PostgreSQL (5433), RabbitMQ (5672/15672) y Kafka (9092) NO
#    se publican al exterior: en compose.yaml aparecen como 127.0.0.1:PUERTO
#    o quedan solo en la red interna, así que no pasan por el hook `input` y no
#    hay que abrirlos aquí.
#
# 5) Elegir nftables **o** UFW, nunca ambos: aplicar los dos genera reglas
#    duplicadas y difíciles de depurar.
#
# VALIDACIÓN OBLIGATORIA ANTES DE APLICAR:
#     sudo nft -c -f /etc/nftables.conf
# =============================================================================
