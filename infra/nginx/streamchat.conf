# =============================================================================
# Stream-Chat — Configuración de Nginx (bloque `server`) para producción académica
# -----------------------------------------------------------------------------
# Ubicación esperada en el servidor:  /etc/nginx/sites-available/streamchat.conf
#   sudo ln -s /etc/nginx/sites-available/streamchat.conf \
#              /etc/nginx/sites-enabled/streamchat.conf
#
# REEMPLAZAR el marcador DOMINIO por el dominio real (p. ej. chat.example.com)
# en TODAS sus apariciones, incluida la ruta del certificado.
#
# Contexto: la app Spring Boot escucha SOLO en 127.0.0.1:8080 (ver compose.yaml,
# puerto "127.0.0.1:8080:8080"). Nginx es el único componente que escucha en
# 80 y 443 y, por tanto, el único punto público (arquitectura de la sección 10.1).
#
# Este archivo está pensado para incluirse desde el contexto `http` de nginx
# (sites-enabled se incluye dentro de `http {}`), de modo que las zonas de
# limitación declaradas abajo quedan en el contexto correcto.
# =============================================================================

# -----------------------------------------------------------------------------
# Zonas de rate limiting (deben vivir en el contexto `http`).
# -----------------------------------------------------------------------------
# limit_req_zone — limita la TASA de peticiones por IP.
#   10 r/s con ráfaga permitida de 20 es holgado para una API REST de chat.
#   Se aplica con la directiva `limit_req` dentro del server.
limit_req_zone $binary_remote_addr zone=streamchat_api:10m rate=10r/s;

# limit_conn_zone — limita las conexiones CONCURRENTES por IP.
#   ATENCIÓN (sección 10.3, punto 1): varios usuarios detrás de una misma IP
#   pública (NAT de una empresa, una universidad o una red móvil) comparten
#   $binary_remote_addr. Un límite bajo (p. ej. el `perip 20` de la guía)
#   castigaría a usuarios legítimos. Se elige un valor generoso.
limit_conn_zone $binary_remote_addr zone=streamchat_conn:10m;

# -----------------------------------------------------------------------------
# Bloque 1 — Puerto 80: redirección a HTTPS y reto ACME.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Reto HTTP-01 de Let's Encrypt. Debe servirse en claro para que certbot
    # pueda emitir/renovar el certificado antes de que exista HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Todo lo demás se redirige a HTTPS (301 permanente).
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Bloque 2 — Puerto 443: servidor HTTPS principal.
# -----------------------------------------------------------------------------
server {
    # `http2` como parámetro de listen es válido en Nginx antiguo y moderno
    # (en >= 1.25.1 está deprecado pero se sigue aceptando). Alternativa en
    # versiones muy nuevas: `listen 443 ssl;` + directiva `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    # --- TLS -----------------------------------------------------------------
    # Certificado emitido por Let's Encrypt (certbot). Renovación automática
    # vía systemd timer (`certbot.timer`), que recarga nginx.
    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    # Solo TLS 1.2 y 1.3 (deshabilitar 1.0/1.1, obsoletos e inseguros).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Caché de sesión TLS: acelera reconexiones.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Endurecimiento básico ----------------------------------------------
    # No revelar la versión de Nginx en cabeceras ni páginas de error
    # (evidencia de la sección 10.5: `curl -I` no muestra la versión).
    server_tokens off;

    # --- Cabeceras de seguridad ---------------------------------------------
    # HSTS: obliga al navegador a usar HTTPS durante un año. Empezar con un
    # valor bajo (p. ej. 300) al probar y subirlo al confirmar que todo es HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Impide que el navegador adivine el tipo de contenido (MIME sniffing).
    add_header X-Content-Type-Options "nosniff" always;

    # Prohíbe incrustar la app en un iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Limita la información de origen enviada a otros sitios.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP básica: la app es una API, no debe cargar recursos de terceros.
    # `connect-src 'self' wss://$host` permite las conexiones WebSocket STOMP.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'" always;

    # --- Límites generales ---------------------------------------------------
    # Rate limiting por IP y límite de conexiones concurrentes por IP
    # (comentado arriba el motivo del valor de conexiones, caso NAT).
    limit_req  zone=streamchat_api burst=20 nodelay;
    limit_conn streamchat_conn 50;

    # Tamaño máximo del cuerpo: los mensajes de chat son pequeños.
    client_max_body_size 1m;

    # -------------------------------------------------------------------------
    # WebSocket / STOMP (SockJS) — endpoint /ws
    # -------------------------------------------------------------------------
    # La app registra el endpoint STOMP con SockJS en /ws (WebSocketConfig:
    # registry.addEndpoint("/ws").withSockJS()).
    #
    # Puntos clave para que el proxy NO corte las sesiones (sección 10.3, 1):
    #   - proxy_http_version 1.1: obligatorio para poder hacer Upgrade.
    #   - Upgrade + Connection "upgrade": realizan el handshake WebSocket.
    #   - proxy_read_timeout LARGO: el `proxy_read_timeout 30s` de la guía
    #     cerraría las conexiones STOMP inactivas. Se usa 3600s y la app envía
    #     heartbeats, por lo que la conexión se mantiene viva.
    #   - proxy_buffering off: los mensajes deben entregarse de inmediato, sin
    #     retención en buffers de Nginx (aplicación en tiempo real).
    #   - SockJS usa además sub-rutas HTTP como /ws/info y
    #     /ws/{server}/{session}/websocket; el prefijo /ws las cubre todas.
    location /ws {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cerrar por inactividad: STOMP mantiene la sesión abierta.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Sin buffering ni caché: es un flujo bidireccional en tiempo real.
        proxy_buffering off;
        proxy_cache     off;
    }

    # -------------------------------------------------------------------------
    # Actuator — health y métricas
    # -------------------------------------------------------------------------
    # /actuator/health solo se consulta localmente (healthcheck de compose,
    # monitorización del host). No debe ser público.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;

        allow 127.0.0.1;
        deny  all;
    }

    # El resto de /actuator/ (info, metrics) tampoco se publica a Internet.
    location /actuator/ {
        deny all;
    }

    # -------------------------------------------------------------------------
    # API REST — prefijo /api/ (AuthController, GroupController, ...)
    # -------------------------------------------------------------------------
    # Los controladores usan rutas /api/v1/...  El prefijo /api/ las cubre.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos cortos para REST: no interesa retener peticiones lentas.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # Raíz — no se sirve contenido en "/". Si en el futuro existe un frontend
    # estático, se añade aquí su `root`/`try_files`.
    # -------------------------------------------------------------------------
    location / {
        return 404;
    }
}
