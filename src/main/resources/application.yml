spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamchat}
    username: ${DB_USERNAME:streamchat}
    password: ${DB_PASSWORD:streamchat}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
