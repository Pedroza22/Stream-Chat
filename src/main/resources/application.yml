spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/streamchat}
    username: ${DB_USERNAME:streamchat}
    password: ${DB_PASSWORD:streamchat}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # ── RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:streamchat}
    password: ${RABBITMQ_PASSWORD:streamchat}
    virtual-host: ${RABBITMQ_VHOST:streamchat}
    publisher-confirm-type: correlated   # publisher confirms habilitados
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual         # ACK manual en todos los listeners
        prefetch: 10                     # buffer del consumidor
        retry:
          enabled: false                 # reintentos propios manejados con colas TTL

  # ── Kafka ─────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                          # espera confirmación de todos los ISR
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: streamchat-presence
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false          # commit manual después de procesar
      properties:
        spring.json.trusted.packages: "com.streamchat.contracts"
        spring.json.add.type.headers: false
        max.poll.records: 50

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  messaging:
    exchange: streamchat.events          # exchange principal tipo topic
    outbox-relay-delay-ms: 5000          # intervalo del relay de outbox
    activity-topic: user-activity        # topic de Kafka para eventos de typing

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
