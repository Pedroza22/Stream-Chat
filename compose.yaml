services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-streamchat}
      POSTGRES_USER: ${DB_USERNAME:-streamchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-streamchat} -d ${DB_NAME:-streamchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    # Sin puertos publicados: PostgreSQL sólo es alcanzable dentro de la red interna.

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-streamchat}
      DB_USERNAME: ${DB_USERNAME:-streamchat}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PRESENCE_TYPING_TTL_MS: ${PRESENCE_TYPING_TTL_MS:-5000}
      PRESENCE_EXPIRATION_SCAN_MS: ${PRESENCE_EXPIRATION_SCAN_MS:-2000}
      PRESENCE_PUBLISHER: ${PRESENCE_PUBLISHER:-local}
    ports:
      # Durante el desarrollo sólo se expone en localhost; en producción queda detrás de Nginx.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
